[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-crm-data-engine"
version = "0.1.0"
description = "End-to-end data pipeline processing 10k+ VIP travel CRM records with Python, PostgreSQL, and AWS S3"
authors = [
    { name = "Fazarath", email = "fazarath.emedia@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "Faker>=19.0.0",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.6",
    "boto3>=1.28.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = "."
